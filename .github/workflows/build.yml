name: Build

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  gba-compilers:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    container:
      image: ghcr.io/zcanann/ffcc-decomp-build:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    # One compiler build shared by every region. The key changes only when
    # the pinned compiler build recipe changes.
    - name: Cache GBA compilers
      uses: actions/cache@v4
      with:
        path: build/tools/gba-agbcc
        key: ${{ runner.os }}-gba-compilers-v1-${{ hashFiles('gba/tools/build_cc1plus.sh') }}

    - name: Prepare GBA compilers
      run: |
        tool_dir="$GITHUB_WORKSPACE/build/tools/gba-agbcc"
        if [ ! -x "$tool_dir/cc1" ] || [ ! -x "$tool_dir/cc1plus" ] || \
           [ ! -x "$tool_dir/gcc2-cpp" ]; then
          apk add --no-cache bash make bison m4 binutils coreutils curl xz
          work_dir=$(mktemp -d)
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            -o "$work_dir/zig.tar.xz"
          echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  $work_dir/zig.tar.xz" \
            | sha256sum -c -
          tar -xf "$work_dir/zig.tar.xz" -C "$work_dir"
          ZIG="$work_dir/zig-linux-x86_64-0.13.0/zig" \
            bash gba/tools/build_cc1plus.sh "$work_dir/compiler" "$tool_dir"
        fi
        cp -p /agbcc/old_agbcc "$tool_dir/old_agbcc"
        for tool in cc1 cc1plus gcc2-cpp old_agbcc; do
          test -x "$tool_dir/$tool" || exit 1
        done

    - name: Share GBA compilers
      uses: actions/upload-artifact@v4
      with:
        name: gba-compilers
        path: build/tools/gba-agbcc/
        retention-days: 1

  build:
    needs: gba-compilers
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # This is a *private* build container.
    # See docs/github_actions.md for more information.
    container:
      image: ghcr.io/zcanann/ffcc-decomp-build:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [GCCP01, GCCE01, GCCJGC]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    # Set Git config
    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Normalize file mod times
    - name: Restore timestamps
      run: |
        uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime \
            --merge --commit-time

    # Copy the original files to the workspace
    - name: Prepare
      run: |
        cp -a /orig .
        sha1sum -c orig/SHA1SUMS

    # Cache tools only. Retail split objects and extracted assets must not
    # enter the public repository's Actions cache.
    - name: Cache build tools
      uses: actions/cache@v4
      with:
        path: build/tools
        key: ${{ runner.os }}-build-tools-v1-${{ hashFiles('configure.py', 'tools/project.py') }}
        restore-keys: ${{ runner.os }}-build-tools-v1-

    - name: Download GBA compilers
      uses: actions/download-artifact@v4
      with:
        name: gba-compilers
        path: build/tools/gba-agbcc

    # Artifact downloads do not preserve executable permissions.
    - name: Check GBA compilers
      run: |
        tool_dir="$GITHUB_WORKSPACE/build/tools/gba-agbcc"
        for tool in cc1 cc1plus gcc2-cpp old_agbcc; do
          chmod +x "$tool_dir/$tool"
          test -x "$tool_dir/$tool" || exit 1
        done

    - name: Install split audit dependencies
      run: apk add --no-cache py3-pyelftools

    # Build the project
    - name: Build
      run: |
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers --gba-binutils /usr/bin \
            --gba-compilers build/tools/gba-agbcc
        ninja all_source progress build/${{ matrix.version }}/report.json
        python -m unittest tools.tests.test_gba_common tools.tests.test_gba_regions tools.tests.test_gba_checker tools.tests.test_project_sources tools.tests.test_report tools.tests.test_gba_recover_splits -v

    # Upload map files
    - name: Upload map
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: |
          build/${{ matrix.version }}/**/*.MAP
          build/${{ matrix.version }}/**/*.map

    # Upload progress report
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json
